name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AA3D74: ${{ secrets.AA3D74 }}
          BAAE01: ${{ secrets.BAAE01 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AA3D74', '')
          tag_b = os.environ.get('BAAE01', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 190698f53359e6b47123e9ebec14985679 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 78eb7bc95a7acc5d751490ae -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
